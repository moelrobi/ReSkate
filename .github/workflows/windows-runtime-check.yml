# Temporary: builds the Windows runtime and server for server-park-mods. Not part of the PR.
name: windows-runtime-check
on: push
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset vs2022-x64 -DDINGOSDK_VERSION=2.0.2
      - name: Build runtime
        run: cmake --build --preset release --target dingosdk_runtime -- /m
      - name: Build server
        run: cmake --build --preset release --target dingosdk_server -- /m
